<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Pech Pechoo</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #111827;
      }
      .loader { text-align: center; padding: 24px; }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #5666ff;
        display: inline-block;
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse { from { opacity: .35; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <main class="loader" aria-label="Loading Pech Pechoo">
      <div class="dot" aria-hidden="true"></div>
      <p>Loading Pech Pechoo…</p>
    </main>
  </body>
</html>
